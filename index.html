<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <link rel="icon" href="logo.svg" />
    <title>yap | snlx.net</title>
    <meta
      name="description"
      content="Browser-optimized paged export for Typst with videos, speaker notes, and custom elements."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        background: #1e1e2e;
      }
      body::backdrop {
        display: none;
      }
      body.book-mode {
        flex-wrap: wrap;
        gap: 1em;
      }
      svg {
        width: 100%;
        height: unset;
        max-height: 100svh;
        display: none;
      }
      body.book-mode svg {
        height: 100svh;
        width: unset;
        display: block;
      }
      @media (min-aspect-ratio: 16/9) {
        svg {
          width: unset;
          height: 100svh;
        }
      }
      svg.visible {
        display: block;
      }
      foreignObject > * {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      #sidebar {
        box-sizing: border-box;
        grid-template-rows: 1fr auto;
        height: 100svh;
        max-width: 50ch;
        font: 16px monospace;
        color: #cdd6f4;
        display: none;
        padding: 1em;
        gap: 1em;
        display: grid;
      }
      .book-mode #sidebar,
      body:fullscreen #sidebar {
        display: none;
      }
      #notes {
        overflow-y: auto;
        scrollbar-color: #cdd6f4 transparent;
        padding: 1rem;
        &:empty {
          padding: 0rem;
        }
      }
      .highlight {
        color: #94e2d5;
      }
      h2 {
        font-weight: normal;
        font-size: 1.2em;
      }
      a {
        color: #94e2d5;
      }
      em {
        color: #94e2d5;
      }
      strong {
        font-weight: normal;
        color: #94e2d5;
      }
      p {
        margin: 1em 0;
      }
      ul,
      ol {
        margin-left: 2em;
      }
      body:has(#notes:not(:empty)) {
        padding-right: 1em;
      }
      @media (max-width: 70ch) {
        body:has(#notes:not(:empty)) {
          padding-right: 0em;
          & > svg {
            display: none;
          }
          #sidebar {
            max-width: unset;
          }
        }
      }
      #controls {
        font-size: 2em;
        padding: 1rem;
        border-radius: 14pt;
        border: 3px solid #94e2d5;
        display: flex;
        justify-content: space-between;
        gap: 1em;
        & div {
          display: flex;
          gap: 1em;
        }
        & button {
          border: none;
          background: transparent;
          cursor: pointer;
        }
        & svg {
          width: 2rem;
          height: 2rem;
          display: block;
          stroke: #cdd6f4;
        }
      }
    </style>
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div id="sidebar">
      <main id="notes"></main>
      <div id="controls">
        <button id="prev">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-left-icon lucide-arrow-left"
          >
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
        </button>

        <span id="timer"></span>

        <div>
          <button id="full">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-fullscreen-icon lucide-fullscreen"
            >
              <path d="M3 7V5a2 2 0 0 1 2-2h2" />
              <path d="M17 3h2a2 2 0 0 1 2 2v2" />
              <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
              <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
              <rect width="10" height="8" x="7" y="8" rx="1" />
            </svg>
          </button>
          <button id="next">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-arrow-right-icon lucide-arrow-right"
            >
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script src="runtime.js"></script>
    <script src="builder.js"></script>
  </body>
</html>
