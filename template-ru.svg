    <text
       xml:space="preserve"
       style="font-weight:bold;font-size:7px;line-height:1.3;font-family:Comfortaa;-inkscape-font-specification:'Comfortaa Bold';writing-mode:lr-tb;direction:ltr;fill:#eeeeee;fill-opacity:1;stroke-width:0.750001;stroke-linecap:round;stroke-linejoin:round"
