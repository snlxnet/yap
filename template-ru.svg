         style="font-size:7px;fill:#eeeeee;fill-opacity:1;stroke-width:0.75"
         x="249.43411"
         y="32.113815"
         id="tspan24">Страница и слайд это одно и то же.</tspan><tspan
         sodipodi:role="line"
         style="font-size:7px;fill:#eeeeee;fill-opacity:1;stroke-width:0.75"
         x="249.43411"
         y="41.213814"
         id="tspan31">Т.к. SVG не умеет несколько страниц в одном доке,</tspan><tspan
         sodipodi:role="line"
         style="font-size:7px;fill:#eeeeee;fill-opacity:1;stroke-width:0.75"
         x="249.43411"
         y="50.313816"
         id="tspan32">страницей считается прямоугольник размером</tspan><tspan
         sodipodi:role="line"
         style="font-size:7px;fill:#eeeeee;fill-opacity:1;stroke-width:0.75"
         x="249.43411"
         y="59.413815"
         id="tspan7">с artboard.</tspan><tspan
         sodipodi:role="line"
         style="font-size:7px;fill:#eeeeee;fill-opacity:1;stroke-width:0.75"
         x="249.43411"
         y="68.513817"
         id="tspan33" /><tspan
         sodipodi:role="line"
         style="font-size:7px;fill:#eeeeee;fill-opacity:1;stroke-width:0.75"
         x="249.43411"
         y="77.613815"
         id="tspan34">Порядок иерархический. Если создать слой</tspan><tspan
         sodipodi:role="line"
         style="font-size:7px;fill:#eeeeee;fill-opacity:1;stroke-width:0.75"
         x="249.43411"
         y="86.713814"
         id="tspan35">над этим и нарисовать на нем страницу, она</tspan><tspan
         sodipodi:role="line"
         style="font-size:7px;fill:#eeeeee;fill-opacity:1;stroke-width:0.75"
         x="249.43411"
         y="95.813812"
         id="tspan36">будет третей. Страницы не должны быть</tspan><tspan
         sodipodi:role="line"
         style="font-size:7px;fill:#eeeeee;fill-opacity:1;stroke-width:0.75"
         x="249.43411"
         y="104.91381"
         id="tspan8">наложны друг на друга.</tspan></text>
