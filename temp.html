<style>
body {
  background: #121212;
}
#button-text,
#tail {
  display: inline !important;
  pointer-events: none;
  user-select: none;
}
#button-new,
#button-open {
  transition: 0.1s ease-in-out;
}
#button-new:hover,
#button-open:hover {
  fill: #a8a5ff !important;
}
#card {
  width: 100% !important;
  height: unset !important;
  max-height: 80vh;
  transform: scale(0.6);
  transform-origin: center;
}
body:has(#card) {
  display: flex;
  justify-content: center;
  align-items: center;
}

#text-book,
#text-presentation,
#lower-page,
#page-book {
  user-select: none;
  pointer-events: none;
}
#bg-book,
#bg-presentation {
  transition: 0.1s ease-in-out;
}
#bg-book:hover,
#bg-presentation:hover {
  fill: #a8a5ff !important;
}
#card:has(#bg-presentation:hover) #text-presentation * {
  fill: #2e2d38 !important;
}
</style>

<div id="card"></div>

<script>
async function loadCard(file) {
  const response = await fetch(file)
  const svg = await response.text()

  card.outerHTML = svg
}

loadCard("/card.svg").then(main)

function main() {
  document.getElementById("button-new").addEventListener("click", selectTemplate)
  document.getElementById("button-open").addEventListener("click", () => {
    alert("open")
  })
}

async function selectTemplate() {
  await loadCard("/format.svg")

  document.getElementById("bg-book").addEventListener("click", () => {
    alert("create book")
  })
  document.getElementById("bg-presentation").addEventListener("click", () => {
    alert("create presentation")
  })
}
</script>
