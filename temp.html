<style>
body {
  background: #001;
}
#button-text,
#tail {
  display: inline !important;
  pointer-events: none;
  user-select: none;
}
#button-new,
#button-open {
  transition: 0.1s ease-in-out;
}
#button-new:hover,
#button-open:hover {
  fill: #99e9f2 !important;
}
#card {
  width: 100% !important;
  height: unset !important;
  max-height: 80vh;
  transform: scale(0.6);
  transform-origin: center;
}
body:has(#card) {
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>

<div id="card"></div>

<script>
fetch("/card.svg").then(res => res.text()).then(text => card.outerHTML = text).then(main)

function main() {
  document.getElementById("button-new").addEventListener("click", () => {
    alert("new")
  })
  document.getElementById("button-open").addEventListener("click", () => {
    alert("open")
  })
}
</script>
